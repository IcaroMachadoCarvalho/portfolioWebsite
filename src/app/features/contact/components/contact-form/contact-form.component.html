<form class="contact__form" [formGroup]="form" (ngSubmit)="sendMessage()">
  <div class="forms__group">
    <label for="name">Nome</label>
    <input
      type="text"
      formControlName="nome"
      name="name"
      id="name"
      [attr.aria-invalid]="form.get('nome')?.invalid"
      aria-describedby="nameInput"
      autocomplete="name"
      [ngClass]="{
        error: form.get('nome')?.errors && form.get('nome')?.touched,
      }"
    />
    <div
      class="error__message"
      id="nameInput"
      *ngIf="form.get('nome')?.errors && form.get('nome')?.touched"
    >
      É necessário preencher o campo
    </div>
  </div>
  <div class="forms__group">
    <label for="email">E-mail</label>
    <input
      type="email"
      id="email"
      name="email"
      [attr.aria-invalid]="form.get('email')?.invalid"
      aria-describedby="emailInput"
      formControlName="email"
      autocomplete="email"
      [ngClass]="{
        error: form.get('email')?.errors && form.get('email')?.touched,
      }"
    />
    <div
      class="error__message"
      id="emailInput"
      *ngIf="form.get('email')?.errors && form.get('email')?.touched"
    >
      Informe um email válido
    </div>
  </div>
  <div class="forms__group">
    <label for="message">Mensagem</label>
    <textarea
      name="message"
      formControlName="mensagem"
      id="message"
      [attr.aria-invalid]="form.get('mensagem')?.invalid"
      aria-describedby="mensagemInput1 mensagemInput2"
      [ngClass]="{
        error: form.get('mensagem')?.errors && form.get('mensagem')?.touched,
      }"
    ></textarea>
    <div
      class="error__message"
      id="mensagemInput1"
      *ngIf="
        form.get('mensagem')?.errors?.['required'] &&
        form.get('mensagem')?.touched
      "
    >
      O campo mensagem deve ser preenchido
    </div>
    <div
      class="error__message"
      id="mensagemInput2"
      *ngIf="
        form.get('mensagem')?.errors?.['minlength'] &&
        form.get('mensagem')?.touched
      "
    >
      A mensagem deve ter pelo menos 10 caracteres.
    </div>
  </div>
  <button
    [ngClass]="form.invalid ? 'invalid' : 'valid'"
    [disabled]="form.invalid"
    [attr.aria-disabled]="form.invalid"
  >
    Enviar mensagem
  </button>
</form>
