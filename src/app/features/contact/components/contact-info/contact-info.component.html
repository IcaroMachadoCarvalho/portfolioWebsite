<aside class="contact__info">
  <h2 class="contact__info__title">Informações de Contato</h2>

  <div class="contact__info__group">
    <!-- Item de E-mail -->
    <a
      [href]="'mailto:' + email"
      target="_blank"
      rel="noopener noreferrer"
      class="contact__card"
    >
      <div class="contact__card__icon">
        <svg
          width="26"
          height="22"
          viewBox="0 0 20 16"
          fill="white"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M2 16C1.45 16 0.979167 15.8042 0.5875 15.4125C0.195833 15.0208 0 14.55 0 14V2C0 1.45 0.195833 0.979167 0.5875 0.5875C0.979167 0.195833 1.45 0 2 0H18C18.55 0 19.0208 0.195833 19.4125 0.5875C19.8042 0.979167 20 1.45 20 2V14C20 14.55 19.8042 15.0208 19.4125 15.4125C19.0208 15.8042 18.55 16 18 16H2V16M10 9L2 4V14V14V14H18V14V14V4L10 9V9M10 7L18 2H2L10 7V7M2 4V2V2V4V14V14V14V14V14V14V4V4"
          />
        </svg>
      </div>
      <div class="contact__card__content">
        <span class="contact__card__label">EMAIL</span>

        <span class="contact__card__value"> {{ email }}</span>
      </div>
    </a>

    <a
      href="https://www.linkedin.com/in/icaromachadodecarvalho/"
      target="_blank"
      rel="noopener noreferrer"
      class="contact__card"
    >
      <div class="contact__card__icon">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="32"
          height="32"
          viewBox="0 0 24 24"
        >
          <circle cx="4.983" cy="5.009" r="2.188"></circle>
          <path
            d="M9.237 8.855v12.139h3.769v-6.003c0-1.584.298-3.118 2.262-3.118 1.937 0 1.961 1.811 1.961 3.218v5.904H21v-6.657c0-3.27-.704-5.783-4.526-5.783-1.835 0-3.065 1.007-3.568 1.96h-.051v-1.66H9.237zm-6.142 0H6.87v12.139H3.095z"
          ></path>
        </svg>
      </div>
      <div class="contact__card__content">
        <span class="contact__card__label">LinkedIn</span>

        <span class="contact__card__value"> in/icaromachadodecarvalho </span>
      </div>
    </a>
  </div>
</aside>
